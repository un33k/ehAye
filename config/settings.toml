# ehAye Configuration
# Main configuration file for the ehAye LLM system

[paths]
# Base directories for cache, models, logs, and configuration
cache_dir = "~/.cache/ehaye"
models_dir = "~/.cache/ehaye/models"
logs_dir = "~/.cache/ehaye/logs" 
config_dir = "~/.config/ehaye"

[performance]
# Performance and optimization settings
omp_num_threads = 8
mlx_memory_pool = true
performance_logging = false
max_cache_size_gb = 50
gpu_memory_fraction = 0.8

[models]
# Model management settings
categories = ["tiny", "small", "medium", "large", "code"]
# default_model = "auto"  # Will be set automatically
preferred_quantization = "4bit"
auto_cleanup = true
max_models_cached = 10
default_backend = "ollama"  # "ollama" or "mlx"
backends = ["ollama", "mlx"]

[cli]
# CLI command prefixes - change these to customize command names
main_command = "ali"
model_command = "mod"
chat_command = "chat"
performance_command = "perf"
system_command = "sys"
ollama_command = "olla"

[chat]
# Chat interface settings
default_temperature = 0.7
default_max_tokens = 512
streaming_enabled = true
history_length = 1000
save_conversations = true

[benchmark]
# Benchmark settings
default_runs = 3
default_tokens = 100
timeout_seconds = 300
save_results = true

# Additional environment variables can be set here
# These will be exported to the environment when ehAye starts
[environment]
# MLX_MEMORY_POOL = "1"
# OMP_NUM_THREADS = "8"