# Environment Configuration
# System-specific settings and environment variables

[system]
# System requirements and validation
min_python_version = "3.10"
min_memory_gb = 4.0
min_disk_gb = 10.0
max_model_memory_gb = 32.0

# Platform-specific settings
[system.macos]
use_metal = true
gpu_memory_allocation = "auto"
thermal_management = true
power_management = "balanced"

[system.linux] 
use_cuda = false
use_metal = false
cpu_optimization = true

[environment_variables]
# MLX-specific environment variables
MLX_CACHE_DIR = "~/.cache/ehaye/mlx"
MLX_MODELS_DIR = "~/.cache/ehaye/models"
MLX_MEMORY_POOL = "1"

# HuggingFace cache configuration
HF_HOME = "~/.cache/ehaye/huggingface"
TRANSFORMERS_CACHE = "~/.cache/ehaye/transformers"
HF_HUB_CACHE = "~/.cache/ehaye/huggingface/hub"

# Performance tuning
OMP_NUM_THREADS = "8"
MKL_NUM_THREADS = "8"
VECLIB_MAXIMUM_THREADS = "8"

# Disable telemetry and warnings
HF_HUB_DISABLE_TELEMETRY = "1"
TOKENIZERS_PARALLELISM = "false"

[paths]
# Directory structure for different file types
[paths.cache]
base = "~/.cache/ehaye"
mlx = "~/.cache/ehaye/mlx"
huggingface = "~/.cache/ehaye/huggingface"
transformers = "~/.cache/ehaye/transformers"
models = "~/.cache/ehaye/models"
downloads = "~/.cache/ehaye/downloads"

[paths.config]
base = "~/.config/ehaye"
settings = "~/.config/ehaye/settings"
models = "~/.config/ehaye/models"
conversations = "~/.config/ehaye/conversations"

[paths.data]
base = "~/.local/share/ehaye"
logs = "~/.local/share/ehaye/logs"
benchmarks = "~/.local/share/ehaye/benchmarks"
exports = "~/.local/share/ehaye/exports"

[validation]
# Environment validation settings
check_virtual_env = true
check_python_version = true
check_system_resources = true
check_required_packages = true

required_packages = [
    "mlx_lm",
    "psutil", 
    "rich",
    "typer",
    "pydantic"
]

optional_packages = [
    "matplotlib",
    "numpy",
    "pandas",
    "jupyter"
]

[security]
# Security and safety settings
allow_model_downloads = true
verify_model_checksums = false
sandbox_model_execution = false
max_generation_tokens = 4096
timeout_seconds = 300

[logging]
# Logging configuration
default_level = "INFO"
log_format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
log_rotation = true
max_log_size_mb = 10
backup_count = 5

[logging.levels]
# Per-module logging levels
"ehaye.core" = "INFO"
"ehaye.models" = "INFO"
"ehaye.llm" = "INFO"
"ehaye.benchmarks" = "INFO"
"ehaye.cli" = "INFO"