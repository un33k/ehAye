# Model Registry Configuration
# Curated list of recommended models for different use cases

[models.tiny]
# Tiny models (< 2B parameters) - Fast and lightweight
recommended = [
    "mlx-community/phi-2-MLX",
    "mlx-community/SmolLM-135M-Instruct-4bit",
    "mlx-community/TinyLlama-1.1B-Chat-v1.0-4bit"
]

[models.small]  
# Small models (2B-3B parameters) - Good balance of speed and quality
recommended = [
    "mlx-community/gemma-2-2b-it-4bit",
    "mlx-community/Qwen2.5-3B-Instruct-4bit",
    "mlx-community/phi-3-mini-4k-instruct-4bit"
]

[models.medium]
# Medium models (3B-8B parameters) - High quality responses
recommended = [
    "mlx-community/Meta-Llama-3-8B-Instruct-4bit",
    "mlx-community/Mistral-7B-Instruct-v0.1-4bit-mlx",
    "mlx-community/Qwen2.5-7B-Instruct-4bit"
]

[models.large]
# Large models (> 8B parameters) - Highest quality
recommended = [
    "mlx-community/Llama-2-13b-chat-hf-4bit-mlx",
    "mlx-community/mixtral-8x7b-instruct-v0.1-4bit",
    "mlx-community/Qwen2.5-14B-Instruct-4bit"
]

[models.code]
# Specialized coding models
recommended = [
    "mlx-community/CodeLlama-7b-Instruct-hf-4bit-mlx",
    "mlx-community/Qwen2.5-Coder-7B-Instruct-4bit",
    "mlx-community/DeepSeek-Coder-6.7B-Instruct-4bit"
]

# Model aliases for easier access
[aliases]
"phi2" = "mlx-community/phi-2-MLX"
"llama3-8b" = "mlx-community/Meta-Llama-3-8B-Instruct-4bit"
"mistral-7b" = "mlx-community/Mistral-7B-Instruct-v0.1-4bit-mlx"
"codellama" = "mlx-community/CodeLlama-7b-Instruct-hf-4bit-mlx"
"gemma2-2b" = "mlx-community/gemma-2-2b-it-4bit"
"qwen-3b" = "mlx-community/Qwen2.5-3B-Instruct-4bit"
"qwen-7b" = "mlx-community/Qwen2.5-7B-Instruct-4bit"
"qwen-coder" = "mlx-community/Qwen2.5-Coder-7B-Instruct-4bit"

# Default model selections by use case
[defaults]
general_chat = "mlx-community/Mistral-7B-Instruct-v0.1-4bit-mlx"
coding = "mlx-community/Qwen2.5-Coder-7B-Instruct-4bit"
fast_responses = "mlx-community/phi-2-MLX"
high_quality = "mlx-community/Meta-Llama-3-8B-Instruct-4bit"

# Model categories and descriptions
[categories.tiny]
description = "Ultra-fast models under 2B parameters"
emoji = "🔵"
use_cases = ["Quick responses", "Testing", "Low-resource environments"]
min_memory_gb = 2

[categories.small]
description = "Balanced models 2B-3B parameters"
emoji = "🟢"
use_cases = ["General chat", "Development", "Education"]
min_memory_gb = 4

[categories.medium]
description = "High-quality models 3B-8B parameters"
emoji = "🟡"
use_cases = ["Production chat", "Content creation", "Analysis"]
min_memory_gb = 8

[categories.large]
description = "Premium models over 8B parameters"
emoji = "🔴"
use_cases = ["Complex reasoning", "Professional work", "Research"]
min_memory_gb = 16

[categories.code]
description = "Specialized programming models"
emoji = "💻"
use_cases = ["Code generation", "Debugging", "Code review"]
min_memory_gb = 8